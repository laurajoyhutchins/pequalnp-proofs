# Historical regression fixture only. Accepted upstream PR #2906; never claim or resubmit.
# Fork-local candidate verification, derived from upstream authoritative.yml at a6fb1ad3452be9050263f025e206582dc2f88295.
# The original checker, build queue and lake-locked.sh are used, not replaced.
# This is a local preflight; no claim, PR, desk mutation or authoritative verdict.
name: Historical checker regression L-pcx-101

on:
  push:
    branches: ['research/regression-L-pcx-101']
    paths: ['research/candidates/*.lean']

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'laurajoyhutchins/pequalnp-proofs'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      W: /opt/pnp
      GAPS_URL: https://data.pequalnp.com/data/desk/gaps.json
    steps:
      - name: Read historical candidate bytes and archived posted statement
        shell: bash
        run: |
          set -euo pipefail
          ( umask 077; : > "$RUNNER_TEMP/steps.log" )
          exec > >(tee -a "$RUNNER_TEMP/steps.log") 2>&1
          GAP=L-pcx-101
          printf '%s' "$GAP" | grep -Eqx 'L-[a-z0-9]+(-[a-z0-9]+)*' || { echo 'REFUSED: malformed candidate branch'; exit 1; }
          [ "${#GAP}" -le 64 ]
          printf '%s' "$GITHUB_SHA" | grep -Eqx '[0-9a-f]{40}'
          echo "GAP=$GAP" >> "$GITHUB_ENV"
          sudo mkdir -p "$W" && sudo chown "$(id -u):$(id -g)" "$W"
          mkdir -p "$W/in"
          git init -q "$W/base"
          git -C "$W/base" fetch -q --depth 1 https://github.com/brilliant-hq/pequalnp-proofs.git a6fb1ad3452be9050263f025e206582dc2f88295
          git -C "$W/base" checkout -q --detach FETCH_HEAD
          [ "$(git -C "$W/base" rev-parse HEAD)" = "a6fb1ad3452be9050263f025e206582dc2f88295" ]
          # Refuse workflow/lock protocol drift; regenerate this adapter from new upstream workflow before running.
          [ "$(git -C "$W/base" hash-object .github/workflows/authoritative.yml)" = "c7fe8aa141ec8bb4c16bd6932d30d5d282bd647d" ] || { echo 'FAULT: upstream sandbox workflow changed; review adapter'; exit 3; }
          git init -q "$W/candidate"
          git -C "$W/candidate" fetch -q --depth 1 https://github.com/laurajoyhutchins/pequalnp-proofs.git "$GITHUB_SHA"
          [ "$(git -C "$W/candidate" rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]
          path="research/candidates/$GAP.lean"
          entry=$(git -C "$W/candidate" ls-tree "$GITHUB_SHA" -- "$path")
          [[ "$entry" == "100644 blob "* ]] || { echo 'REFUSED: candidate must be a plain nonexecutable file'; exit 1; }
          [ "$(git -C "$W/candidate" cat-file -s "$GITHUB_SHA:$path")" -le 524288 ] || { echo 'REFUSED: candidate too large'; exit 1; }
          git -C "$W/candidate" show "$GITHUB_SHA:$path" > "$W/in/proof.lean"
          [ -s "$W/in/proof.lean" ] || { echo 'REFUSED: empty candidate'; exit 1; }
          [ "$(git hash-object "$W/in/proof.lean")" = "48abb85c391722eaaf6f10345ce4de646bed350f" ] || { echo 'FAULT: regression proof differs from accepted upstream blob'; exit 3; }
          git init -q "$W/archive"
          git -C "$W/archive" fetch -q --depth 1 https://github.com/laurajoyhutchins/pequalnp-proofs.git c04f243ded01c616280a95e47d1614999848aff9
          [ "$(git -C "$W/archive" rev-parse FETCH_HEAD)" = "c04f243ded01c616280a95e47d1614999848aff9" ]
          git -C "$W/archive" show "c04f243ded01c616280a95e47d1614999848aff9:packets/L-pcx-101/packet.json" > "$W/in/archive-packet.json"
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(process.argv[1])); if(p.upstream_sha!=="a6fb1ad3452be9050263f025e206582dc2f88295"||p.id!=="L-pcx-101")process.exit(1); fs.writeFileSync(process.argv[2],JSON.stringify({gaps:[{id:p.id,file:p.file,module:p.module,statement:p.statement,imports:p.permitted_project_imports}]}))' "$W/in/archive-packet.json" "$W/in/gaps.json"
          file=$(node -e 'const g=JSON.parse(require("fs").readFileSync(process.argv[1])).gaps.filter(x=>x.id===process.argv[2]); if(g.length!==1||typeof g[0].file!=="string"||!/^lean\/PEqualNP\/Outside\/L_[a-z0-9_]+\.lean$/.test(g[0].file)) process.exit(1); process.stdout.write(g[0].file)' "$W/in/gaps.json" "$GAP") || { echo 'REFUSED: gap not posted or invalid'; exit 1; }
          guard="$W/base/.github/scripts/outside-guard.mjs"
          node "$guard" gap "$W/in/gaps.json" "$GAP" "$file" "$W/in"
          [ ! -e "$W/base/$file" ] && [ ! -L "$W/base/$file" ] || { echo 'REFUSED: gap file exists in upstream'; exit 1; }
          printf '%s\n' "$file" > "$W/in/pr.file"
          jq -cn --arg gap "$GAP" --arg candidate "$GITHUB_SHA" --arg upstream "$(git -C "$W/base" rev-parse HEAD)" --arg file "$file" --arg blob "$(git hash-object "$W/in/proof.lean")" --arg snapshot "$(sha256sum "$W/in/gaps.json" | cut -d' ' -f1)" --arg statement "$(sha256sum "$W/in/statement.txt" | cut -d' ' -f1)" '{scope:"historical_regression_only",gap:$gap,candidate_sha:$candidate,upstream_sha:$upstream,file:$file,candidate_blob:$blob,snapshot_sha256:$snapshot,statement_sha256:$statement}' > "$RUNNER_TEMP/candidate.identity.json"
          stop="stop-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$stop"
          trap 'echo "::$stop::"' EXIT
          node "$guard" imports "$W/in/proof.lean" "$W/in/imports.json" "$file"
          node "$guard" closure "$W/base" "$W/in/imports.json" "$file" "$W/in"
          trap - EXIT
          echo "::$stop::"

      - name: Install the pinned Lean toolchain
        run: |
          set -eu
          export ELAN_HOME="$W/elan"
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --no-modify-path --default-toolchain none
          "$ELAN_HOME/bin/elan" toolchain install "$(cat "$W/base/lean/lean-toolchain")"
          cd "$W/base/lean"
          # The real binaries of the pinned toolchain, so the check does not depend on a launcher.
          tc=$(dirname "$("$ELAN_HOME/bin/elan" which lake)")
          [ -x "$tc/lake" ] && [ -x "$tc/lean" ]
          echo "TC_BIN=$tc" >> "$GITHUB_ENV"

      - name: Fetch the prebuilt Mathlib and build the trusted parts
        run: |
          set -eu
          cd "$W/base/lean"
          export PATH="$TC_BIN:$PATH" PEQUALNP_REAL_LAKE="$TC_BIN/lake" PEQUALNP_HOME="$W/queue" LAKE_ARTIFACT_CACHE=false
          "$TC_BIN/lake" exe cache get
          # Base code only: the verifier, the definitions, and the base modules the gap lets the
          # file import (in/base-imports.txt). The proof file is not in the tree yet, so nothing
          # of it is compiled here. No outside-written module is named here, and none is reached:
          # the guard refused a base module that imports one. Listed outside modules are built
          # in the locked step, by the checker's own build of the proof file.
          # The whole of Mathlib is named too: the cache does not carry every hash file Lake
          # keeps beside a module, and Lake writes a missing one the first time it replays that
          # module. That must happen here, as this account, because the locked account cannot
          # write under the library (it failed there on two modules: permission denied).
          set -- checklemma +Mathlib +PEqualNP.Defs
          while IFS= read -r m; do if [ -n "$m" ]; then set -- "$@" "+$m"; fi; done < "$W/in/base-imports.txt"
          # CONTAINMENT: during this build the folder of outside-written files is not in the tree
          # (moved aside, one rename on the same disk; the guard step has already read it). Should
          # anything built here import an outside module after all, Lean finds no such module and
          # the build fails, so this step fails: it can never compile one. The folder is put back
          # when this step ends, however it ends, before the steps that need it (the lock step
          # puts the proof file into it, and hashes the listed outside sources).
          aside="$W/aside"; mkdir "$aside"
          # Put back onto an empty place only: were a folder of that name there (something made it
          # during the build), mv would nest the saved folder inside it and the check would pass.
          restore() {
            if [ -e "$aside/Outside" ]; then
              if [ -e PEqualNP/Outside ] || [ -L PEqualNP/Outside ]; then echo "FAULT: a folder of outside files appeared during the base build; the saved one was not put back"; exit 1; fi
              mv "$aside/Outside" PEqualNP/Outside
            fi
          }
          trap restore EXIT
          moved=no; if [ -e PEqualNP/Outside ]; then mv PEqualNP/Outside "$aside/Outside"; moved=yes; fi
          [ ! -e PEqualNP/Outside ] || { echo "FAULT: the folder of outside files could not be moved aside"; exit 1; }
          ../tools/bin/lake build "$@"
          restore; trap - EXIT
          if [ "$moved" = yes ]; then
            [ -d PEqualNP/Outside ] && [ ! -e "$aside/Outside" ] || { echo "FAULT: the folder of outside files was not put back"; exit 1; }
          fi
          # A tripwire as well: nothing under PEqualNP/Outside may have been built here.
          if [ -n "$(find .lake/build/lib/lean/PEqualNP/Outside .lake/build/ir/PEqualNP/Outside -type f 2>/dev/null | head -n 1)" ]; then
            echo "FAULT: the base step built an outside-written module; stopping before anything else runs"; exit 1
          fi

      - name: Swap space for the verifier
        run: |
          set -eu
          # The verifier loads the library more than once in one process, and only the first
          # load is shared with the files on disk: for a proof that imports all of Mathlib it
          # needs more memory than a standard runner has. Without swap it starves the runner
          # (the run hangs and its log is lost). The swap file belongs to root, mode 0600.
          # The disk has no room for it until toolsets this run never uses are removed.
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          # As large as the emptier disk allows while 6 GB of it stay free, at most 12 GB.
          df -m / /mnt 2>/dev/null || true
          d=$(df -m --output=avail,target / /mnt 2>/dev/null | awk 'NR>1' | sort -rn | awk 'NR==1{print $2}')
          mb=$(( $(df -m --output=avail "$d" | awk 'NR==2{print $1}') - 6144 ))
          [ "$mb" -le 12288 ] || mb=12288
          if [ "$mb" -ge 1024 ]; then
            f="${d%/}/pnp-swap"
            sudo fallocate -l "${mb}M" "$f" && sudo chmod 600 "$f"
            sudo mkswap -q "$f" && sudo swapon "$f"
          fi
          free -m

      - name: Put the file in place and lock the tree
        run: |
          set -eu
          file=$(cat "$W/in/pr.file")
          install -m 0644 "$W/in/proof.lean" "$W/base/$file"
          # git refuses a tree owned by another account unless told the tree is safe.
          printf '[safe]\n\tdirectory = *\n' > "$W/in/gitconfig"
          # The account the hostile compile runs as. It has no sudo and owns almost nothing.
          sudo useradd --system --create-home --shell /usr/sbin/nologin outsider
          # Nothing under $W is writable by that account ...
          chmod -R a+rX,go-w "$W"
          # ... except the output directories of its own module. It cannot create a file
          # anywhere else in the tree, so it cannot plant a setting, a package or a library.
          # The listed outside modules (in/outside-imports.txt) are flat files of the same
          # directory (PEqualNP.Outside.L_<gap>), so their compiled results land here too, written
          # by the locked account, and nothing of the base is: every base module they import was
          # built in the base step. Whatever is compiled here, the verifier sends every one of
          # their constants to the kernel again, as it does those of the proof file.
          for d in lib/lean ir; do
            mkdir -p "$W/base/lean/.lake/build/$d/PEqualNP/Outside"
            sudo chown outsider:outsider "$W/base/lean/.lake/build/$d/PEqualNP/Outside"
          done
          # What the verdict will be about, hashed before the hostile step runs. With it, the
          # source of every listed outside module (in/outside-sources.txt: paths the guard wrote,
          # each matching base/lean/PEqualNP/Outside/L_<gap>.lean, so word splitting is safe).
          ( cd "$W" && sha256sum "base/$file" in/statement.txt base/tools/check-lean.mjs base/tools/build.sh \
              base/tools/bin/lake base/lean/CheckLemma.lean base/lean/.lake/build/bin/checklemma \
              base/.github/scripts/lake-locked.sh $(cat in/outside-sources.txt) ) | tee "$RUNNER_TEMP/before.sha256"

      - name: Run the BASE checker on the file (the only step that runs outside code)
        id: run
        # A backstop only: the checker's own limit below (20 minutes, and 4 more per listed
        # outside module, at most 45) ends it first, with a recorded exit code, so the verdict
        # step reports a FAULT and prints what it was doing.
        timeout-minutes: 50
        run: |
          # The checker's exit code is read below, so a nonzero one must not end this step.
          set +e -u
          file=$(cat "$W/in/pr.file")
          # What the machine was doing, every 30 s, kept for the verdict step: the busiest
          # processes, memory and swap, swap and disk traffic, memory pressure, which builds have
          # finished. Written by this account into a directory closed to every other one. The
          # process list can show arguments of the locked build, so the verdict step prints it
          # only quoted.
          mkdir -m 700 "$RUNNER_TEMP/sampler"
          t0=$(date +%s)
          ( while sleep 30; do
              echo "--- t=$(( $(date +%s) - t0 ))s"
              ps -eo user:10,etime,pcpu,rss,args --sort=-pcpu | head -5 | cut -c1-200
              free -m | sed -n 2,3p
              vmstat 1 2 | tail -1 | awk '{print "swap in/out " $7 "/" $8 " KB/s, disk in/out " $9 "/" $10 " blocks/s, iowait " $16 "%"}'
              head -n 1 /proc/pressure/memory 2>/dev/null
              cat "$RUNNER_TEMP"/builds/*/cmd 2>/dev/null
            done ) > "$RUNNER_TEMP/sampler/log" 2>&1 &
          sampler=$!
          node_bin=$(dirname "$(readlink -f "$(command -v node)")")
          cd "$W/base"
          # Full build output, kept by lake-locked.sh. Created and owned by this account, closed
          # to every other one: the locked account can neither list, read nor create files in it.
          mkdir -m 700 "$RUNNER_TEMP/builds"
          # The same command the project's own records are made with:
          #   node tools/check-lean.mjs <lean file> <statement file> check
          # The environment is emptied, so no credential of this run is in it. The checker and
          # the verifier run as this run's account. Every build goes through lake-locked.sh and
          # runs as `outsider` (see that file). The compile is another account than the checker,
          # so it cannot signal it, read or write its memory, or write to its output files.
          # The checker and everything it starts, the locked compile included, run inside one
          # memory limit below the machine's memory. What they need beyond it goes to swap,
          # instead of starving the runner itself, which loses the log and leaves the run hanging.
          # The same machine for every run, whatever runner GitHub hands out: two cores and at
          # most 6.5 GB of memory (the rest goes to swap). That is the 2 core, 8 GB runner on
          # which honest proofs that import all of Mathlib are accepted in about 7 minutes. On
          # the 4 core, 16 GB runner a limit of the machine's memory less 1.5 GB starved the
          # runner itself: the run lost contact with GitHub after 45 minutes and left no log.
          cap=$(( $(awk '/^MemTotal:/{print $2}' /proc/meminfo) - 1572864 ))
          [ "$cap" -le 6815744 ] || cap=6815744
          echo "memory: $(awk '/^MemTotal:/{print $2}' /proc/meminfo) kB, limit for the checker: $cap kB"
          # Time: 20 minutes for the proof file, 4 more for each listed outside module the same
          # build compiles first, at most 45 minutes.
          limit=$(( 1200 + 240 * $(grep -c . "$W/in/outside-imports.txt" || true) ))
          [ "$limit" -le 2700 ] || limit=2700
          echo "time limit for the checker: $limit s"
          # THE MEMORY WATCH (2026-11-23: three public runs lost their machine in this step and left
          # no log). Every 60 s ONE line goes to this step's own output, which GitHub shows live, so a
          # lost machine leaves its last numbers on the page: the machine's available memory, swap in
          # use, the checker's memory now and at its peak (its own cgroup, the scope named below).
          # And the machine is never lost silently: when the MACHINE itself runs short (available
          # memory under 5 percent of all of it for two samples in a row, or memory pressure 'full'
          # over 40 percent for the last minute), the watch ends the checker and the verdict step
          # reports a FAULT with that line. Not at 90 percent of the checker's own limit: under a
          # hard limit the checker works at its limit and swaps, which is how a heavy honest proof
          # passes; it is the machine running short that loses a runner.
          unit="pnp-check-$GITHUB_RUN_ID"
          cg="/sys/fs/cgroup/system.slice/$unit.scope"
          ( low=0
            while sleep 60; do
              total=$(awk '/^MemTotal:/{print $2}' /proc/meminfo); avail=$(awk '/^MemAvailable:/{print $2}' /proc/meminfo)
              swap=$(awk '/^SwapTotal:/{t=$2} /^SwapFree:/{f=$2} END{print t-f}' /proc/meminfo)
              now=$(cat "$cg/memory.current" 2>/dev/null || echo 0); peak=$(cat "$cg/memory.peak" 2>/dev/null || echo 0)
              full=$(awk '/^full/{for(i=1;i<=NF;i++) if($i ~ /^avg60=/){sub("avg60=","",$i); print int($i)}}' /proc/pressure/memory 2>/dev/null || echo 0)
              echo "memory watch t=$(( $(date +%s) - t0 ))s: available $((avail / 1024)) MB of $((total / 1024)), swap used $((swap / 1024)) MB, checker now $((now / 1048576)) MB, peak $((peak / 1048576)) MB of $((cap / 1024)), pressure full $full%"
              if [ "$avail" -lt $((total / 20)) ]; then low=$((low + 1)); else low=0; fi
              if [ "$low" -ge 2 ] || [ "${full:-0}" -gt 40 ]; then
                echo "memory watch: the MACHINE is running short (available $((avail / 1024)) MB, pressure full $full%): ending the checker before the runner is lost" | tee -a "$RUNNER_TEMP/checker.err"
                sudo systemctl kill --signal=KILL "$unit.scope" 2>/dev/null || true
                break
              fi
            done ) &
          watch=$!
          sudo systemd-run --quiet --scope --collect --unit="$unit" -p MemoryMax="${cap}K" \
              --uid="$(id -u)" --gid="$(id -g)" \
          taskset -c 0,1 env -i HOME="$HOME" LANG=C.UTF-8 PATH="$TC_BIN:$node_bin:/usr/bin:/bin" \
              PEQUALNP_REAL_LAKE="$W/base/.github/scripts/lake-locked.sh" PEQUALNP_HOME="$W/queue" \
              PNP_TC_BIN="$TC_BIN" PNP_GITCONFIG="$W/in/gitconfig" PNP_BUILD_LOGS="$RUNNER_TEMP/builds" \
            timeout -k 30 "$limit" node "$W/base/tools/check-lean.mjs" "$W/base/$file" "$W/in/statement.txt" check \
            > "$RUNNER_TEMP/checker.out" 2> "$RUNNER_TEMP/checker.err"
          code=$?
          kill "$sampler" "$watch" 2>/dev/null
          # Ended by the memory watch: a FAULT of the machine, never a verdict on the proof.
          if grep -q '^memory watch: the MACHINE is running short' "$RUNNER_TEMP/checker.err" 2>/dev/null; then
            code=137
          else
            # 124 or 137: the time limit ended the checker. A FAULT, never a verdict on the proof.
            case "$code" in 124|137) echo "the checker was stopped after $limit seconds" >> "$RUNNER_TEMP/checker.err" ;; esac
          fi
          # Nothing the compile started may outlive it, and neither may the verifier.
          sudo pkill -KILL -u outsider || true
          pkill -KILL -f "$W/base/lean/.lake/build/bin/checklemma" || true
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Print the checker's last line, MANIFEST, and the verdict
        # Always: whatever stopped the run, its last step says why in one place.
        if: always()
        env:
          CODE: ${{ steps.run.outputs.code }}
          RAN: ${{ steps.run.outcome }}
        run: |
          set -u
          # Everything below that a pull request can influence (the checker's output, the build
          # output, a guard's reason) is printed ONLY through quoted, between stop-commands and
          # its resume token: control characters removed, every line cut and prefixed with
          # "  | ". So no such line can be a workflow command, and none can start with
          # VERDICT. The verdict is the job's conclusion and the VERDICT line this step writes
          # itself, to the log and to the step summary, from $CODE and the checks below.
          quoted() { tr -d '\000-\010\013-\037\177' | cut -c1-2000 | sed 's/^/  | /'; }
          stop="stop-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          if [ -z "$CODE" ] && [ "$RAN" != skipped ] && [ -n "$RAN" ]; then
            # The checker's step started and recorded no exit code: it was stopped (its time
            # limit, or the run was cancelled). No verdict. What it was doing is printed quoted.
            echo "::stop-commands::$stop"
            for b in "$RUNNER_TEMP"/builds/*/; do
              [ -d "$b" ] || continue
              echo "----- a build's output (tail) -----"
              cat "$b/cmd" 2>/dev/null | quoted; tail -n 15 "$b/out" | quoted; tail -n 15 "$b/err" | quoted
            done
            tail -n 15 "$RUNNER_TEMP/checker.err" 2>/dev/null | quoted
            echo "----- the machine, last samples -----"
            tail -n 40 "$RUNNER_TEMP/sampler/log" 2>/dev/null | quoted
            echo "::$stop::"
            echo "VERDICT: FAULT (the checker's step was stopped before it finished: $RAN. This says nothing about the proof.)" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/local-verdict.txt"
            exit 3
          fi
          if [ -z "$CODE" ]; then
            # The checker's step never started, so no outside code ran. steps.log was written
            # only by the guard steps before that step, as this account (0600). A REFUSED
            # line in it is a guard's refusal of the pull request; without one, the run itself
            # failed, which says nothing of the proof.
            if grep -aq '^REFUSED' "$RUNNER_TEMP/steps.log" 2>/dev/null; then
              echo "::stop-commands::$stop"
              grep -a '^REFUSED' "$RUNNER_TEMP/steps.log" | tail -n 1 | quoted
              echo "::$stop::"
              echo "VERDICT: REFUSED (before any build; the reason is the quoted line above)" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/local-verdict.txt"
              exit 1
            fi
            echo "VERDICT: FAULT (the run stopped before the checker started; the failed step above says where. This says nothing about the proof.)" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/local-verdict.txt"
            exit 3
          fi
          file=$(cat "$W/in/pr.file")
          # The trusted files must be what they were before the hostile step.
          ( cd "$W" && sha256sum "base/$file" in/statement.txt base/tools/check-lean.mjs base/tools/build.sh \
              base/tools/bin/lake base/lean/CheckLemma.lean base/lean/.lake/build/bin/checklemma \
              base/.github/scripts/lake-locked.sh $(cat in/outside-sources.txt) ) > "$RUNNER_TEMP/after.sha256"
          same=yes; cmp -s "$RUNNER_TEMP/before.sha256" "$RUNNER_TEMP/after.sha256" || same=no
          last=$(tail -n 1 "$RUNNER_TEMP/checker.out")
          manifests=$(grep -c '^MANIFEST {' "$RUNNER_TEMP/checker.out" || true)
          # The one line the hub records an outside proof from: which gap, pull request and file
          # this run judged, and the sha256 of that file and of the statement as hashed BEFORE the
          # outside step ran (before.sha256). The statement hash is of in/statement.txt, the
          # posted text byte for byte with no newline added, which is the form the hub hashes.
          # Every value was validated or computed by this run, and jq builds the JSON. It is
          # printed unquoted and before the quoted block, so no quoted line can pass for it.
          fsha=$(awk -v p="base/$file" '$2 == p { print $1 }' "$RUNNER_TEMP/before.sha256")
          ssha=$(awk '$2 == "in/statement.txt" { print $1 }' "$RUNNER_TEMP/before.sha256")
          if printf '%s %s' "$fsha" "$ssha" | grep -Eqx '[0-9a-f]{64} [0-9a-f]{64}'; then
            echo "LOCAL_CANDIDATE $(jq -cn --arg lemma "$GAP" --arg head "$GITHUB_SHA" --arg file "$file" --arg f "$fsha" --arg s "$ssha" '{lemma: $lemma, candidate_commit: $head, file: $file, file_sha256: $f, statement_sha256: $s}')"
          fi
          # The output can quote the proof file. It is printed with workflow commands switched
          # off, so a line in it cannot pass for an instruction to the runner.
          echo "::stop-commands::$stop"
          echo "----- checker diagnostics (first lines, then tail) -----"
          head -n 3 "$RUNNER_TEMP/checker.err" | quoted
          tail -n 30 "$RUNNER_TEMP/checker.err" | quoted
          # The checker passes on only the last lines of a failed build. The first errors of
          # each build that failed are printed here from the full output lake-locked.sh kept.
          for b in "$RUNNER_TEMP"/builds/*/; do
            [ -f "$b/cmd" ] || continue
            grep -q '(exit 0)$' "$b/cmd" && continue
            echo "----- first errors of a build that failed -----"
            cat "$b/cmd" "$b/out" "$b/err" | grep -av 'designed for use with the module system' \
              | grep -a -m 8 -A 15 -E '^lake |^error|^✖|: error' | quoted
          done
          tail -n 40 "$RUNNER_TEMP/checker.out" | grep -av '^MANIFEST {' | quoted
          if [ "$CODE" != 0 ] && [ "$CODE" != 1 ]; then
            echo "----- the machine, last samples -----"
            tail -n 40 "$RUNNER_TEMP/sampler/log" 2>/dev/null | quoted
          fi
          echo "----- MANIFEST -----"
          grep -a '^MANIFEST {' "$RUNNER_TEMP/checker.out" | cut -c1-200000 | sed 's/^/  | /' || true
          echo "----- last line -----"
          printf '%s\n' "$last" | quoted
          echo "::$stop::"
          echo "----- what was checked -----"
          echo "local candidate only; gap: $GAP"
          echo "candidate commit: $GITHUB_SHA   file: $file   content hash: $(git hash-object "$W/in/proof.lean")"
          echo "base commit: $(git -C "$W/base" rev-parse HEAD)   statement sha256: $(sha256sum "$W/in/statement.txt" | cut -d' ' -f1)"
          echo "Historical replay only; no live gap or authorization to submit."
          if [ -s "$W/in/outside-imports.txt" ]; then
            # Printed by this step from paths the guard wrote; no text of a pull request.
            echo "----- listed outside modules -----"
            echo "Their sources were hashed before the locked step and compared after it (with the files above)."
            echo "The compiled files the verifier loaded for them were written in the locked step, by the"
            echo "locked account; the verifier sent every constant of them to the kernel again."
            echo "sha256 of each compiled file after the checker ran:"
            while IFS= read -r m; do
              # The locked account wrote this file: read only a plain file, never a link or a
              # pipe, and with a time limit.
              o="$W/base/lean/.lake/build/lib/lean/$(printf '%s' "$m" | tr . /).olean"
              h="(no plain compiled file)"
              if [ -f "$o" ] && [ ! -L "$o" ]; then h=$(timeout 60 sha256sum "$o" | cut -d' ' -f1); fi
              echo "  $m ${h:-(could not be read)}"
            done < "$W/in/outside-imports.txt"
          fi
          # ACCEPTED needs all of: exit 0, an ACCEPTED last line, one MANIFEST line, untouched files.
          verdict=FAULT
          case "$CODE" in
            0) case "$last" in "ACCEPTED (check)"*) [ "$manifests" = 1 ] && [ "$same" = yes ] && verdict=ACCEPTED ;; esac ;;
            1) case "$last" in REJECTED*) verdict=REJECTED ;; esac ;;
          esac
          echo "VERDICT: $verdict (checker exit $CODE)" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/local-verdict.txt"
          [ "$verdict" = ACCEPTED ] && exit 0
          [ "$verdict" = REJECTED ] && exit 1
          exit 3

      - name: Preserve local candidate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-regression-receipt
          path: |
            ${{ runner.temp }}/candidate.identity.json
            ${{ runner.temp }}/local-verdict.txt
            ${{ runner.temp }}/steps.log
            ${{ runner.temp }}/before.sha256
            ${{ runner.temp }}/after.sha256
            ${{ runner.temp }}/checker.out
            ${{ runner.temp }}/checker.err
          if-no-files-found: warn
          retention-days: 30
