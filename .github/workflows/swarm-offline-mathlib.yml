name: Export pinned swarm Mathlib for offline VM
on:
  push:
    branches: [toolchains/lean-v4.36.0-transfer]
    paths: [.github/workflows/swarm-offline-mathlib.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: brilliant-hq/pequalnp-proofs
          ref: a6fb1ad3452be9050263f025e206582dc2f88295
          path: swarm
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare disk and install exact Lean release
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          curl -fL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.36.0/lean-4.36.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "2b7ab1ed8b92d2e6abfaf41344823b510064dbc9c0260cac73eb496ab2dea6eb  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/lean.tar.zst"
          tool="$RUNNER_TEMP/lean-4.36.0-linux/bin"
          test -x "$tool/lean" && test -x "$tool/lake"
          "$tool/lean" --version
          "$tool/lake" --version
          echo "$tool" >> "$GITHUB_PATH"
      - name: Fetch Mathlib and verify every manifest pin
        working-directory: swarm/lean
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.36.0
          lean --version
          lake --version
          lake exe cache get
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          m = json.loads(Path('lake-manifest.json').read_text())
          for p in m['packages']:
              d = Path(m['packagesDir']) / p['name']
              rev = subprocess.check_output(['git','-C',str(d),'rev-parse','HEAD'],text=True).strip()
              assert rev == p['rev'], (p['name'],rev,p['rev'])
              assert not subprocess.check_output(['git','-C',str(d),'diff','HEAD','--'],text=True), p['name']
              print(p['name'], rev)
          assert next(p['rev'] for p in m['packages'] if p['name']=='mathlib') == 'fc4f59e577feb1a4956671bc04ac18aaaf8cd842'
          PY
          test -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean
          cat > "$RUNNER_TEMP/CacheSmoke.lean" <<'LEAN'
          import Mathlib
          theorem cacheSmoke (x y : ℂ) : (x+y)*(x-y) = x^2-y^2 := by ring
          #print axioms cacheSmoke
          LEAN
          lake env lean "$RUNNER_TEMP/CacheSmoke.lean"
          git diff --exit-code
          du -sh .lake/packages
      - name: Package exact source checkout and prebuilt dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          git -C swarm rev-parse HEAD > transfer/UPSTREAM_COMMIT
          sha256sum swarm/lean/lean-toolchain swarm/lean/lake-manifest.json swarm/lean/lakefile.toml swarm/tools/check-lean.mjs > transfer/CONFIG.sha256
          cp swarm/lean/lake-manifest.json transfer/lake-manifest.json
          tar --exclude=swarm/lean/.lake/build --exclude=swarm/lean/.lake/check.lock -cf - swarm | zstd -T2 -3 | split -b 180M -d -a 3 - transfer/swarm-offline.tar.zst.part-
          (cd transfer && sha256sum swarm-offline.tar.zst.part-* > PARTS.sha256)
          cat transfer/swarm-offline.tar.zst.part-* | sha256sum | awk '{print $1 "  swarm-offline.tar.zst"}' > transfer/ARCHIVE.sha256
          count=$(find transfer -name 'swarm-offline.tar.zst.part-*' | wc -l)
          test "$count" -le 40
          test "$count" -gt 0
          ls -lh transfer
      - name: Transfer manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: swarm-offline-manifest
          path: |
            transfer/*.sha256
            transfer/UPSTREAM_COMMIT
            transfer/lake-manifest.json
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Transfer part 000
        if: ${{ hashFiles('transfer/swarm-offline.tar.zst.part-000') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
