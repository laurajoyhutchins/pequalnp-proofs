name: Stock Lean proof latency baseline
on:
  push:
    branches: [research/lean-verification-performance]
    paths:
      - .github/workflows/stock-lean-baseline.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stock-lean-baseline
  cancel-in-progress: false
jobs:
  baseline:
    if: github.repository == 'laurajoyhutchins/pequalnp-proofs'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check pinned configuration and benchmark driver
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(cat lean/lean-toolchain)" = leanprover/lean4:v4.36.0
          python3 -c 'import json; assert next(p for p in json.load(open("lean/lake-manifest.json"))["packages"] if p["name"] == "mathlib")["rev"] == "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"'
          python3 tools/bench-verification.py --self-test
      - uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: elan-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}
      - name: Install stock toolchain
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean/lean-toolchain)"
      - name: Restore pinned dependencies
        working-directory: lean
        run: |
          set -euo pipefail
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = fc4f59e577feb1a4956671bc04ac18aaaf8cd842
          test -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean
      - name: Prepare trusted fork-local research corpus
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ["RUNNER_TEMP"]) / "evidence"
          root = Path("lean/PEqualNP/Research")
          def case(name, expected="accepted", statement=None):
              src = root / (name + ".lean")
              assert src.is_file() and not src.is_symlink()
              return {"file": str(src), "statement": statement if statement is not None else (root / (name + ".statement.txt")).read_text(), "kind": "check", "expected": expected}
          good = case("CutCapacity")
          # A deliberately false recorded statement; same candidate and imports.
          bad = case("CutCapacity", "rejected", "False")
          finite = case("PetersenCut")
          (out / "official-cases.json").write_text(json.dumps([good, bad], indent=2))
          (out / "elaboration-cases.json").write_text(json.dumps([good, finite], indent=2))
          PY
          # Isolate the queue for this ephemeral single-job host.
          mkdir -p "$RUNNER_TEMP/queue"
          printf '1\n' > "$RUNNER_TEMP/queue/build-slots.conf"
          printf '2\n' > "$RUNNER_TEMP/queue/build-jobs.conf"
          echo "PEQUALNP_HOME=$RUNNER_TEMP/queue" >> "$GITHUB_ENV"
      - name: Prepare memory headroom
        run: |
          set -euo pipefail
          free -m
          # Match the existing checker workflow's hosted-runner swap policy.
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          d=$(df -m --output=avail,target / /mnt 2>/dev/null | awk 'NR>1' | sort -rn | awk 'NR==1{print $2}')
          mb=$(( $(df -m --output=avail "$d" | awk 'NR==2{print $1}') - 6144 ))
          [ "$mb" -le 12288 ] || mb=12288
          if [ "$mb" -ge 1024 ]; then
            f="${d%/}/pnp-baseline-swap"
            sudo fallocate -l "${mb}M" "$f"
            sudo chmod 600 "$f"
            sudo mkswap -q "$f"
            sudo swapon "$f"
          fi
          free -m
      - name: Measure exploratory elaboration
        timeout-minutes: 20
        run: |
          timeout -k 30 1050 python3 tools/bench-verification.py --mode elaborate --cases "$RUNNER_TEMP/evidence/elaboration-cases.json" --out "$RUNNER_TEMP/evidence/elaboration" --repetitions 3
      - name: Measure unchanged official checker
        if: always() && !cancelled()
        timeout-minutes: 35
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/evidence/official-cases.json"
          cap=$(( $(awk '/^MemTotal:/{print $2}' /proc/meminfo) - 1572864 ))
          [ "$cap" -le 6815744 ] || cap=6815744
          sudo systemd-run --quiet --scope --collect -p MemoryMax="${cap}K" --uid="$(id -u)" --gid="$(id -g)" \
            env HOME="$HOME" PATH="$PATH" PEQUALNP_HOME="$PEQUALNP_HOME" taskset -c 0,1 timeout -k 30 1950 \
            python3 tools/bench-verification.py --mode official --cases "$RUNNER_TEMP/evidence/official-cases.json" --out "$RUNNER_TEMP/evidence/official" --repetitions 2
      - name: Publish timing receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-lean-baseline
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
