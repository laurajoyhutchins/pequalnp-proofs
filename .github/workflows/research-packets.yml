name: Research packet ingestion

on:
  schedule:
    # Seven minutes before each of the five hourly research-worker starts.
    # GitHub scheduled workflows are best effort; workers must still reconcile live.
    - cron: '9,21,33,45,57 * * * *'
  workflow_dispatch:
  push:
    branches: [research/workstation]
    paths:
      - 'tools/control/packets.mjs'
      - 'tools/control/research_knowledge.py'
      - '.github/workflows/research-packets.yml'

permissions:
  contents: read

concurrency:
  group: research-packet-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    if: github.repository == 'laurajoyhutchins/pequalnp-proofs' && github.ref == 'refs/heads/research/workstation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch immutable upstream source and public desk feed
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --single-branch --branch main https://github.com/open-goat/pequalnp-proofs.git "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" rev-parse HEAD
          curl -fsS --proto '=https' --max-redirs 0 --max-filesize 32000000 --max-time 60 -o "$RUNNER_TEMP/gaps.json" https://data.pequalnp.com/data/desk/gaps.json
          date -u +%FT%TZ > "$RUNNER_TEMP/observed"
      - name: Compile research packets
        run: |
          set -euo pipefail
          node --check tools/control/packets.mjs
          node tools/control/packets.mjs "$RUNNER_TEMP/upstream" "$RUNNER_TEMP/gaps.json" "$RUNNER_TEMP/packets" "$(cat "$RUNNER_TEMP/observed")"
          python3 -c 'import json,sys; x=json.load(open(sys.argv[1])); print("Upstream:",x["upstream_sha"],"Posted:",len(x["gaps"]),"Closure blockers:",sum(g["closure_blocker"] is not None for g in x["gaps"]))' "$RUNNER_TEMP/packets/index.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Enrich with public research graph, strategy and prior attempts
        run: |
          set -euo pipefail
          python3 tools/control/research_knowledge.py "$RUNNER_TEMP/packets"
      - uses: actions/upload-artifact@v4
        with:
          name: research-packets
          path: ${{ runner.temp }}/packets/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: ingest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: research-packets
          path: ${{ runner.temp }}/packet-data
      - name: Publish generated data, never execute it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/packet-data"
          # Only the known packet layout may enter the generated data branch.
          python3 - "$data" <<'PY'
          import json, pathlib, re, sys
          root=pathlib.Path(sys.argv[1])
          index=json.loads((root/'index.json').read_text())
          expected={'index.json'}
          for gap in index['gaps']:
              gid=gap['id']
              assert re.fullmatch(r'L-[a-z0-9]+(-[a-z0-9]+)*',gid)
              expected.update(f'packets/{gid}/{name}' for name in ('packet.json','statement.txt','Skeleton.lean'))
          expected.update(('knowledge/summary.json','knowledge/strategy.json'))
          for p in (root/'knowledge').iterdir():
              assert re.fullmatch(r'(?:summary|strategy|program-[a-z0-9]+|search-[0-9a-z]|L-[a-z0-9]+-[0-9]{3,})\.json',p.name)
              expected.add(p.relative_to(root).as_posix())
          actual=set()
          for p in root.rglob('*'):
              assert not p.is_symlink()
              if p.is_dir(): continue
              assert p.is_file()
              actual.add(p.relative_to(root).as_posix())
          assert actual==expected
          assert index['upstream_repository']=='open-goat/pequalnp-proofs'
          from datetime import datetime, timezone
          age=(datetime.now(timezone.utc)-datetime.fromisoformat(index['observed_at'].replace('Z','+00:00'))).total_seconds()
          assert 0<=age<=1200, 'refusing stale publication'
          PY
          cd "$data"
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin https://github.com/laurajoyhutchins/pequalnp-proofs.git
          gh auth setup-git --hostname github.com
          old=$(git ls-remote origin refs/heads/research/frontier | cut -f1)
          if [ -n "$old" ]; then
            git fetch -q --depth 1 origin refs/heads/research/frontier
            [ "$(git rev-parse FETCH_HEAD)" = "$old" ]
            git show "$old:index.json" > "$RUNNER_TEMP/old-index.json"
            if python3 - "$RUNNER_TEMP/old-index.json" index.json <<'PY'
          import json,sys
          a,b=(json.load(open(p)) for p in sys.argv[1:])
          keys=('snapshot_sha256','upstream_sha','generator_sha256','public_research_sha256','observed_at')
          sys.exit(0 if all(a.get(k) is not None and a[k]==b.get(k) for k in keys) else 1)
          PY
            then
              echo 'Exact observation already published.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          git add -- index.json packets/ knowledge/
          tree=$(git write-tree)
          if [ -n "$old" ]; then
            commit=$(printf '%s\n' 'Refresh public swarm research packets' | git commit-tree "$tree" -p "$old")
          else
            commit=$(printf '%s\n' 'Initialize generated swarm research packets' | git commit-tree "$tree")
          fi
          # Non-forced push protects the existing branch against concurrent changes.
          git push --porcelain origin "$commit:refs/heads/research/frontier"
          echo "Published generated frontier: $commit" >> "$GITHUB_STEP_SUMMARY"
